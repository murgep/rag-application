name: RAG Application CI

on:
  push:
    branches:
      - main
      - master
      - feature/local-authentication

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ragdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      LOCAL_AUTH_ENABLED: "true"
      JWT_SECRET: ci-test-secret-that-is-not-used-in-production
      JWT_ISSUER: rag-local
      JWT_AUDIENCE: rag-api
      JWT_ACCESS_TOKEN_MINUTES: "15"
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: ragdb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      GEMINI_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Initialize database schema
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/init_database.py

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

